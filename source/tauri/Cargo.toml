[package]
name = "locus"
version = "0.2.0"
edition = "2021"

[lib]
name = "locus_lib"
crate-type = ["staticlib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "macos-private-api", "image-png"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
tauri-runtime = "2"
tauri-plugin-dialog = "2"
tiny_http = "0.12"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
ed25519-dalek = "2"
base64 = "0.22"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "=2.3.1"
window-vibrancy = "0.6"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSWorkspace", "NSEvent", "NSImage", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "NSString"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = ["NSEnumerator", "NSNotification", "NSOperation", "NSSet", "NSString"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIBlurEffect", "UIGestureRecognizer", "UIPanGestureRecognizer", "UIResponder", "UIScene", "UISceneOptions", "UISceneSession", "UIView", "UIVisualEffect", "UIVisualEffectView", "UIWindow", "UIWindowScene", "block2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
