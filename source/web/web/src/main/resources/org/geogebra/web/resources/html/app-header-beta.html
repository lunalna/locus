<script>
var showHeader = !(window.isEmbed && window.isEmbed());
defaultParams.marginTop = showHeader ? 64 : 0;

window.addEventListener("load", function() {
	if (!showHeader) {
		document.getElementById("logoID").parentElement.parentElement.style.display = "none";
	}
	var offline = document.getElementById("logoID").getAttribute("href") == "#";
	if (offline) {
	    document.getElementById("logoID").classList.add("hideButton");
	}

window.ggbHeaderResize = function(event) {
	var elAppPicker = document.getElementById("suiteAppPicker");
	var rectAppPicker = elAppPicker.getBoundingClientRect();
	var rectButtonsLeft = document.getElementById("buttonsID").getBoundingClientRect().left;
	var elExam = document.getElementById("examId");
	var rectExamLeft = elExam ? elExam.getBoundingClientRect().left : 0;
	var overlap = rectAppPicker.right > Math.max(rectButtonsLeft, rectExamLeft);
	elAppPicker.style.visibility = overlap ? "hidden" : "visible";

	var headerAppSide = document.getElementById("logoID").parentElement;
	var headerAppSideRight = headerAppSide.getBoundingClientRect().right;
	var elExamType = document.getElementById("examTypeId");
    var examTypeLeft = elExamType ? elExamType.getBoundingClientRect().left : 0;
	var overlapExam = examTypeLeft < headerAppSideRight;
	if (elExamType) {
	    elExamType.style.visibility = overlapExam ? "hidden" : "visible";
	}
}

window.addEventListener("resize", ggbHeaderResize);

});
</script>
